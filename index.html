<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BFCM 2026</title>
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <style>
    :root {
      --page: #f1f1f1;
      --ink: #1c1c1c;
      --ink-2: #333333;
      --text: #303030;
      --muted: #b5b5b5;
      --sub-cool: #cbd5e1;
      --colon: #e3e3e3;
      --gold: #ffb657;
      --gold-mid: #ffe99d;
      --gold-deep: #db9350;
      --font: Inter, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page);
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .chrome,
    .page {
      width: min(950px, calc(100% - 32px));
      margin-left: auto;
      margin-right: auto;
    }

    .chrome { margin-top: 40px; }

    .page {
      margin-top: 20px;
      padding-bottom: 72px;
    }

    .page[data-adapt="tablet"] { width: min(768px, calc(100% - 32px)); }
    .page[data-adapt="mobile"] { width: min(390px, calc(100% - 32px)); }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px 16px;
    }

    .tabs {
      display: flex;
      flex-wrap: nowrap;
      gap: 4px;
      width: max-content;
      max-width: 100%;
      margin: 0;
      padding: 4px;
      overflow-x: auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.08);
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar { display: none; }

    .tabs button {
      appearance: none;
      border: 0;
      background: transparent;
      color: #616161;
      font-family: inherit;
      font-weight: 550;
      font-size: 13px;
      line-height: 20px;
      flex: none;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    .tabs button:hover:not([aria-selected="true"]) {
      background: rgba(0, 0, 0, 0.05);
      color: var(--text);
    }

    .tabs button[aria-selected="true"] {
      background: var(--ink);
      color: #fff;
    }

    .adapt-size {
      margin-left: 6px;
      font-weight: 450;
      font-size: 12px;
      letter-spacing: 0;
      opacity: 0.55;
    }

    .tabs button[aria-selected="true"] .adapt-size { opacity: 0.78; }

    .tabs button:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .banner {
      container-type: inline-size;
      container-name: banner;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      border: 1px solid #fff0bf;
      background: linear-gradient(90deg, #1c1c1c 0%, #333333 100%);
    }

    .glow {
      position: absolute;
      pointer-events: none;
      z-index: 0;
    }

    .glow-left {
      width: 780px;
      height: 780px;
      left: -340px;
      top: -300px;
    }

    .glow-center {
      width: 240px;
      height: 240px;
      left: 42%;
      top: -30px;
    }

    .watermark {
      position: absolute;
      z-index: 1;
      left: 50%;
      top: -4.1cqw;
      transform: translateX(-50%);
      margin: 0;
      font-family: Kameron, "Times New Roman", serif;
      font-weight: 700;
      font-size: 19.035cqw;
      line-height: 1.2;
      letter-spacing: -0.037em;
      white-space: nowrap;
      color: transparent;
      -webkit-text-stroke: 0.22cqw #ffffa2;
      opacity: 0.06;
      pointer-events: none;
      user-select: none;
      -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 18.6%, transparent 71.5%);
      mask-image: linear-gradient(to bottom, #000 0%, #000 18.6%, transparent 71.5%);
    }

    .banner-b .watermark { top: -2cqw; }

    .banner-body {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
      padding: 16px;
    }

    .copy {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      width: 100%;
      max-width: 100%;
      min-width: 0;
    }

    .art {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 140px;
      pointer-events: none;
    }

    .title-line {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      min-width: 0;
      max-width: 100%;
    }

    .title {
      margin: 0;
      min-width: 0;
      font-weight: 700;
      font-size: 24px;
      line-height: 32px;
      letter-spacing: -0.2px;
      background: linear-gradient(90deg, #ffffff 0%, var(--gold) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    .banner-b .title {
      font-weight: 650;
      font-size: 20px;
      line-height: 24px;
      white-space: pre-line;
    }

    .sparkle {
      display: block;
      width: 29px;
      height: 29px;
      flex: none;
    }

    .offer-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-start;
      gap: 14px;
      width: 100%;
      max-width: 100%;
      min-width: 0;
    }

    .banner-b .offer-row { margin-top: 3px; }

    .sub {
      margin: 0;
      display: block;
      flex: 0 1 auto;
      width: auto;
      max-width: 100%;
      min-width: 0;
      color: #cbd5e1;
      font-weight: 550;
      font-size: 13px;
      line-height: 20px;
    }

    .sub-line {
      display: block;
      max-width: 100%;
      min-width: 0;
    }

    @container banner (min-width: 700px) {
      .offer-row { flex-wrap: nowrap; }
    }

    .offer {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: none;
      gap: 6.316px;
      padding: 1.263px 5.053px;
      border-radius: 18.316px;
      background: linear-gradient(90deg, var(--gold) 0%, var(--gold-mid) 50%, var(--gold-deep) 100%);
      color: #000;
      font-family: "Libre Baskerville", "Songti SC", "Noto Serif SC", serif;
      font-style: italic;
      font-weight: 700;
      font-size: 12.632px;
      line-height: 28.421px;
      white-space: nowrap;
    }

    .offer span:empty { display: none; }

    .offer-num {
      font-size: 20.211px;
      line-height: 28.421px;
    }

    .gift,
    .piece {
      position: absolute;
      display: block;
      object-fit: contain;
    }

    .gift {
      left: 50%;
      top: 50%;
      width: 120px;
      height: 120px;
      transform: translate(-50%, -50%);
    }

    .banner-b .gift {
      width: 128px;
      height: 128px;
      transform: translate(-50%, -50%) rotate(15deg);
    }

    .piece-a {
      left: calc(50% - 74px);
      top: 22px;
      width: 42px;
      height: 40px;
    }

    .piece-b {
      left: calc(50% + 28px);
      top: 16px;
      width: 36.12px;
      height: 33.98px;
      transform: rotate(75deg);
    }

    .banner-b .piece-b {
      width: 43.46px;
      height: 40.88px;
    }

    .timer {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: max-content;
      max-width: 100%;
    }

    .timer-label {
      display: flex;
      align-items: center;
      gap: 2px;
      color: #fff;
      font-weight: 550;
      font-size: 13px;
      line-height: 20px;
      white-space: nowrap;
    }

    .timer-label img {
      width: 20px;
      height: 20px;
      flex: none;
    }

    .clock {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .ticks,
    .units {
      display: grid;
      grid-template-columns: 40px 30px 40px 30px 40px 30px 40px;
      align-items: center;
    }

    .tick {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      font-weight: 650;
      font-size: 20px;
      line-height: 24px;
      letter-spacing: -0.2px;
      font-variant-numeric: tabular-nums;
    }

    .colon {
      text-align: center;
      color: var(--colon);
      font-weight: 650;
      font-size: 20px;
      line-height: 24px;
      letter-spacing: -0.2px;
    }

    .units span {
      text-align: center;
      color: var(--muted);
      font-weight: 450;
      font-size: 12px;
      line-height: 16px;
    }

    @container banner (max-width: 699px) {
      .ticks,
      .units {
        grid-template-columns: 34px 16px 34px 16px 34px 16px 34px;
      }

      .tick {
        width: 34px;
        height: 34px;
        font-size: 16px;
        border-radius: 7px;
      }

      .colon { font-size: 16px; }

      .art {
        position: absolute;
        top: auto;
        left: auto;
        right: 0;
        bottom: 0;
        width: 180px;
        height: 140px;
      }

      .banner-b .art { right: 8px; bottom: 18px; }
    }

    @container banner (min-width: 700px) and (max-width: 919px) {
      .banner-body {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 108px 250px;
        grid-template-areas: "copy art timer";
        align-items: center;
        column-gap: 10px;
        row-gap: 0;
        padding: 18px 16px 18px 20px;
      }

      .copy { grid-area: copy; width: auto; }
      .banner-b .copy { padding-right: 8px; }
      .art {
        grid-area: art;
        width: 108px;
        height: 120px;
        justify-self: center;
      }
      .timer { grid-area: timer; justify-self: end; }

      .gift { width: 100px; height: 100px; }
      .banner-b .gift { width: 108px; height: 108px; }

      .piece-a {
        left: -4px;
        top: 22px;
        width: 32px;
        height: 30px;
      }

      .piece-b {
        left: auto;
        right: -6px;
        top: 10px;
        width: 30px;
        height: 28px;
      }

      .banner-b .piece-b { width: 34px; height: 32px; }
    }

    @container banner (min-width: 920px) {
      .banner-body {
        display: block;
        min-height: 124px;
        padding: 26px 24px 16px;
      }

      .banner-b .banner-body { min-height: 163px; }

      .banner-a .copy { max-width: 454px; }
      .banner-b .copy { max-width: 428px; }
      .banner-a .title { white-space: nowrap; }

      .glow-left {
        width: 982px;
        height: 982px;
        left: -467px;
        top: -434px;
      }

      .glow-center {
        width: 288px;
        height: 288px;
        left: 419px;
        top: -48px;
      }

      .art {
        position: absolute;
        inset: 0;
        width: auto;
        height: auto;
      }

      .timer {
        position: absolute;
        top: 15px;
        right: 34px;
        width: 250px;
      }

      .banner-b .timer { top: 36px; }

      .banner-a .gift {
        left: 506px;
        top: 3px;
        width: 128px;
        height: 128px;
        transform: none;
      }

      .banner-a .piece-a {
        left: 492px;
        top: 18px;
        width: 42px;
        height: 40px;
        transform: none;
      }

      .banner-a .piece-b {
        left: 637.42px;
        top: 21.15px;
        right: auto;
        width: 36.12px;
        height: 33.98px;
        transform: rotate(75deg);
      }

      .banner-b .gift {
        left: 517.44px;
        top: 30.18px;
        width: 143.98px;
        height: 143.98px;
        transform: rotate(15deg);
      }

      .banner-b .piece-a {
        left: 464px;
        top: 36px;
        width: 42px;
        height: 40px;
        transform: none;
      }

      .banner-b .piece-b {
        left: 632.13px;
        top: 29.84px;
        right: auto;
        width: 43.46px;
        height: 40.88px;
        transform: rotate(75deg);
      }
    }

    .banner-cta {
      appearance: none;
      position: relative;
      z-index: 4;
      display: inline-block;
      max-width: 100%;
      margin-top: 12px;
      padding: 10px 16px;
      border: 0;
      border-radius: 999px;
      background: #eaf4ff;
      color: #303030;
      font-family: inherit;
      font-weight: 550;
      font-size: 14px;
      line-height: 20px;
      text-align: center;
      white-space: normal;
      cursor: pointer;
    }

    .banner-cta:hover { background: #dcedff; }

    .banner-cta:focus-visible {
      outline: 2px solid #ffb657;
      outline-offset: 2px;
    }

    @container banner (max-width: 420px) {
      .banner-cta { margin-top: 10px; margin-bottom: 6px; }
    }

    body.modal-open { overflow: hidden; }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      padding: 16px;
    }

    .modal[hidden] { display: none; }

    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(12, 12, 12, 0.62);
    }

    .modal-panel {
      container-type: inline-size;
      container-name: modal;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      width: min(620px, 100%);
      max-height: calc(100vh - 32px);
      max-height: calc(100dvh - 32px);
      overflow: hidden;
      border-radius: 20px;
      background: linear-gradient(180deg, #1a1a1a 0%, #353535 100%);
      box-shadow:
        0 20px 20px -8px rgba(26, 26, 26, 0.28),
        inset 0 1px 0 rgba(204, 204, 204, 0.5),
        inset 0 -1px 0 rgba(0, 0, 0, 0.17),
        inset 1px 0 0 rgba(0, 0, 0, 0.13),
        inset -1px 0 0 rgba(0, 0, 0, 0.17);
      color: #fff;
    }

    body[data-adapt="mobile"] .modal-panel {
      width: min(358px, 100%);
    }

    .modal-mark {
      position: absolute;
      z-index: 0;
      left: 50%;
      top: -55px;
      transform: translateX(-50%);
      margin: 0;
      font-family: Kameron, "Times New Roman", serif;
      font-weight: 700;
      font-size: 217.568px;
      line-height: 261.082px;
      letter-spacing: -8.05px;
      white-space: nowrap;
      color: transparent;
      -webkit-text-stroke: 2.5px #ffffa2;
      opacity: 0.1;
      pointer-events: none;
      user-select: none;
    }

    .modal-glow {
      position: absolute;
      z-index: 0;
      left: 0;
      top: calc(50% - 303px);
      width: 0;
      height: 0;
      pointer-events: none;
    }

    .modal-glow img {
      position: absolute;
      max-width: none;
      transform: translate(-50%, -50%);
    }

    .modal-close {
      position: absolute;
      z-index: 3;
      top: 12px;
      right: 12px;
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      padding: 4px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
    }

    .modal-close img { display: block; }

    .modal-close:hover { background: rgba(255, 255, 255, 0.08); }

    .modal-close:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

    .modal-scroll {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      min-height: 0;
      overflow: auto;
      overscroll-behavior: contain;
      padding: 40px 32px;
    }

    .modal-panel[data-variant="live"] [data-panel="ending"],
    .modal-panel[data-variant="ending"] [data-panel="live"] {
      display: none;
    }

    .modal-live,
    .modal-ending {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .modal-live { gap: 16px; }
    .modal-ending { gap: 4px; }

    .modal-head {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .modal-head-live { gap: 8px; }

    .modal-title {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 100%;
      margin: 0;
      font-weight: 700;
      font-size: 30px;
      line-height: 40px;
      letter-spacing: -0.3px;
      text-align: center;
      color: #fff;
    }

    .modal-title-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      column-gap: 6px;
      row-gap: 0;
      max-width: 100%;
    }

    .modal-title-row .sparkle { margin-top: 0; }

    .modal-gold {
      background-image: linear-gradient(90deg, #ffe99d 0%, #db9350 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    .modal-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 29px;
      background: linear-gradient(90deg, var(--gold) 0%, var(--gold-mid) 50%, var(--gold-deep) 100%);
      color: #303030;
      text-align: center;
    }

    .modal-pill-live {
      position: relative;
      padding: 11.174px 13.968px 6.984px;
      border-radius: 40.506px;
      font-weight: 700;
      font-size: 13px;
      line-height: 17px;
    }

    .modal-pill-end {
      padding: 4px 10px;
      font-weight: 550;
      font-size: 13px;
      line-height: 20px;
    }

    .modal-badge-img { display: block; }

    html[lang="en"] .modal-live-badge-text {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    html:not([lang="en"]) .modal-badge-img { display: none; }

    html:not([lang="en"]) .modal-pill-live {
      padding: 9px 16px;
      border-radius: 40.506px;
      font-weight: 700;
      font-size: 16px;
      line-height: 24px;
    }

    .modal-copy {
      max-width: 556px;
      margin: 0;
      color: rgba(203, 213, 225, 0.9);
      font-weight: 450;
      font-size: 13px;
      line-height: 20px;
      text-align: center;
    }

    .modal-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.09);
    }

    .modal-card-label {
      margin: 0;
      color: rgba(203, 213, 225, 0.9);
      font-weight: 450;
      font-size: 13px;
      line-height: 20px;
      text-align: center;
    }

    .modal-clock {
      display: grid;
      grid-template-columns: 56px 30px 56px 30px 56px 30px 56px;
      align-items: center;
      justify-content: center;
      justify-items: center;
      row-gap: 6px;
      max-width: 100%;
    }

    .modal-tick {
      display: grid;
      place-items: center;
      width: 56px;
      height: 56px;
      border-radius: 8px;
      background: #fff;
      color: #303030;
      font-weight: 700;
      font-size: 30px;
      line-height: 40px;
      letter-spacing: -0.3px;
      font-variant-numeric: tabular-nums;
    }

    .modal-colon {
      color: #e3e3e3;
      font-weight: 650;
      font-size: 20px;
      line-height: 24px;
      letter-spacing: -0.2px;
    }

    .modal-unit {
      color: #b5b5b5;
      font-weight: 450;
      font-size: 12px;
      line-height: 16px;
      text-align: center;
    }

    .modal-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: 100%;
    }

    .modal-later,
    .modal-go {
      appearance: none;
      max-width: 100%;
      padding: 12px 16px;
      white-space: normal;
      border: 0;
      border-radius: 999px;
      font-family: inherit;
      font-weight: 550;
      font-size: 14px;
      line-height: 20px;
      text-align: center;
      cursor: pointer;
    }

    .modal-later {
      background: transparent;
      color: #b5b5b5;
    }

    .modal-later:hover { background: rgba(255, 255, 255, 0.06); color: #fff; }

    .modal-go {
      background: #eaf4ff;
      color: #303030;
    }

    .modal-go:hover { background: #dcedff; }

    .modal-later:focus-visible,
    .modal-go:focus-visible {
      outline: 2px solid #ffb657;
      outline-offset: 2px;
    }

    @container modal (max-width: 520px) {
      .modal-scroll { padding: 36px 16px 20px; }
      .modal-title {
        font-size: 24px;
        line-height: 32px;
        letter-spacing: -0.24px;
      }
      .modal-clock {
        grid-template-columns: 46px 14px 46px 14px 46px 14px 46px;

    const htmlLang = { zh: "zh-Hans", en: "en", fr: "fr", pt: "pt", es: "es" };
    const tabs = [...document.querySelectorAll("[data-lang]")];
    const adaptTabs = [...document.querySelectorAll("[data-adapt]")];
    const stage = document.querySelector(".page");

    function lookup(obj, path) {
      return path.split(".").reduce((value, key) => value[key], obj);
    }

    function apply(lang) {
      const t = copy[lang];
      document.documentElement.lang = htmlLang[lang];
      document.querySelectorAll("[data-t]").forEach((node) => {
        node.textContent = lookup(t, node.dataset.t);
      });
      tabs.forEach((tab) => {
        const on = tab.dataset.lang === lang;
        tab.setAttribute("aria-selected", on ? "true" : "false");
        tab.tabIndex = on ? 0 : -1;
      });
      try { localStorage.setItem("bfcm-lang", lang); } catch (err) {}
    }

    function pad(n) {
      return String(n).padStart(2, "0");
    }

    let deadline;
    try {
      const saved = Number(sessionStorage.getItem("bfcm-deadline"));
      deadline = saved || 0;
      if (!deadline) {
        deadline = Date.now() + (((47 * 24 + 20) * 60 + 34) * 60 + 29) * 1000;
        sessionStorage.setItem("bfcm-deadline", String(deadline));
      }
    } catch (err) {
      deadline = Date.now() + (((47 * 24 + 20) * 60 + 34) * 60 + 29) * 1000;
    }

    function tick() {
      const remain = Math.max(0, deadline - Date.now());
      const total = Math.floor(remain / 1000);
      const parts = {
        d: Math.floor(total / 86400),
        h: Math.floor((total % 86400) / 3600),
        m: Math.floor((total % 3600) / 60),
        s: total % 60
      };
      document.querySelectorAll("[data-part]").forEach((node) => {
        node.textContent = pad(parts[node.dataset.part]);
      });
    }

    function bindTabs(list, select) {
      list.forEach((tab) => {
        tab.addEventListener("click", () => select(tab));
      });
      list[0].parentElement.addEventListener("keydown", (event) => {
        const keys = ["ArrowRight", "ArrowLeft", "Home", "End"];
        if (!keys.includes(event.key)) return;
        event.preventDefault();
        const current = list.findIndex((tab) => tab.getAttribute("aria-selected") === "true");
        let next = current;
        if (event.key === "ArrowRight") next = (current + 1) % list.length;
        if (event.key === "ArrowLeft") next = (current - 1 + list.length) % list.length;
        if (event.key === "Home") next = 0;
        if (event.key === "End") next = list.length - 1;
        list[next].focus();
        select(list[next]);
      });
    }

    function applyAdapt(adapt) {
      stage.dataset.adapt = adapt;
      document.body.dataset.adapt = adapt;
      adaptTabs.forEach((tab) => {
        const on = tab.dataset.adapt === adapt;
        tab.setAttribute("aria-selected", on ? "true" : "false");
        tab.tabIndex = on ? 0 : -1;
      });
      try { localStorage.setItem("bfcm-adapt", adapt); } catch (err) {}
    }

    bindTabs(tabs, (tab) => apply(tab.dataset.lang));
    bindTabs(adaptTabs, (tab) => applyAdapt(tab.dataset.adapt));

    let initial = "zh";
    let initialAdapt = "desktop";
    try {
      const stored = localStorage.getItem("bfcm-lang");
      if (stored && copy[stored]) initial = stored;
      const storedAdapt = localStorage.getItem("bfcm-adapt");
      if (storedAdapt && ["desktop", "tablet", "mobile"].includes(storedAdapt)) initialAdapt = storedAdapt;
    } catch (err) {}

    apply(initial);
    applyAdapt(initialAdapt);
    tick();
    setInterval(tick, 1000);

    const modal = document.getElementById("plan-modal");
    const panel = modal.querySelector(".modal-panel");
    let opener = null;

    function focusableInModal() {
      return [...panel.querySelectorAll("button")].filter((el) => el.getClientRects().length > 0);
    }

    function openModal(variant, button) {
      opener = button;
      panel.dataset.variant = variant;
      panel.setAttribute("aria-labelledby", variant === "ending" ? "modal-title-ending" : "modal-title-live");
      modal.hidden = false;
      document.body.classList.add("modal-open");
      panel.focus({ preventScroll: true });
    }

    function closeModal() {
      if (modal.hidden) return;
      modal.hidden = true;
      document.body.classList.remove("modal-open");
      if (opener && opener.isConnected) opener.focus();
      opener = null;
    }

    document.querySelectorAll("[data-modal]").forEach((button) => {
      button.addEventListener("click", () => openModal(button.dataset.modal, button));
    });

    modal.addEventListener("click", (event) => {
      if (event.target.closest("[data-close]")) closeModal();
    });

    document.addEventListener("keydown", (event) => {
      if (modal.hidden) return;
      if (event.key === "Escape") {
        event.preventDefault();
        closeModal();
        return;
      }
      if (event.key !== "Tab") return;
      const items = focusableInModal();
      if (!items.length) return;
      const first = items[0];
      const last = items[items.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    });
